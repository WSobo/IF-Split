# IF-Split "certified" config — the most trustworthy holdout the metadata supports.
#
# The problem this solves. CATH/ECOD/SCOP2 are curated retrospectively, so their
# coverage LAGS deposition: on the 2026-07-22 snapshot 0.8% of pre-2020 entries are
# unclassified but 36.5% of 2025 and 55.3% of 2026 releases are. A holdout that looks
# "fold-disjoint" under those three is therefore disjoint largely because the databases
# have not reached the newest entries — measured, 75.9% of such held-out entries share a
# Pfam/InterPro family with training. That leakage is invisible to the structural
# authorities, and no cutoff on chain length or release year avoids it (leakage runs
# 60-87% in EVERY stratum, and rises with length).
#
#   structural_clustering: "all"  — merge on CATH/ECOD/SCOP2 *and* the Pfam/InterPro HMM
#     domain families. The HMMs are computed from SEQUENCE, so they carry no curation lag
#     (InterPro alone covers 94.9% of entries vs 92.3% for all three structural
#     authorities combined) and they see homology far below 30% identity. This is what
#     makes the holdout disjoint by evidence rather than by missing annotation.
#   split_strategy: "maximal"     — do NOT demand a fixed ratio. Strong merging collapses
#     the PDB into one giant component (98.6% of entries), so the largest leakage-safe
#     holdout is whatever remains; "maximal" takes exactly that and splits it evenly.
#     split_fractions below act as a CEILING, never a target.
#
# Measured on 2026-07-22 (216,822 entries): train 213,890 (98.6%) / val 1,467 / test 1,465,
# 888 of the held-out entries CERTIFIED novel under all five authorities, and 0% domain
# leakage into train (down from 75.9%). The holdout is small because that is how much
# genuinely novel structure the PDB contains — not a tuning choice.
#
# Build it:  uv run if-split build --config config/certified.yaml --out data/certified
# Existing snapshot? scripts/fetch_domain_annotations.py adds the domain families without
# re-enumerating (see its --apply mode).

snapshot_date: "2026-05-30"        # release_date <= this. The reproducibility anchor.
experimental_methods: ["X-RAY DIFFRACTION", "ELECTRON MICROSCOPY"]
resolution_max_A: 3.5
resolution_max_A_by_method: {"ELECTRON MICROSCOPY": 3.0}  # cryo-EM 3.5A != X-ray 3.5A for sidechains
max_total_residues: 5999           # max residues KEPT (drop if > this); LigandMPNN kept < 6000
min_modeled_residues: 20           # drop tiny/poly-UNK chains: the sequence is the training label
excluded_het: ["HOH", "NA", "CL", "K", "BR"]
use_biological_assembly: true

purification_metals: ["NI", "CO"]
histag_min_run: 6
histag_terminal_min_run: 3
exclude_purification_artifacts: true

identity_threshold: 0.30
clustering_backend: "precomputed"
structural_clustering: "all"
# fold_benchmark_method: ecod      # opt-in novel-fold sidecars (folds.json, fold_groups.json,
#                                  # novel_fold_test.json). Use a DIFFERENT authority than
#                                  # structural_clustering (scop2) above: matching them makes the
#                                  # novel-fold count a tautological ~100% (the same-method merge
#                                  # already forbids a fold from straddling splits). off (default)
#                                  # emits nothing, omitted from the config hash. Labels never
#                                  # change the split.
split_fractions: {train: 0.80, val: 0.10, test: 0.10}
split_strategy: "maximal"
split_salt: "snapsplit-v1"
seed: 0

test_min_per_class: {}

max_clashscore: null
max_rfree: null
max_ramachandran_outlier_pct: null
max_rotamer_outlier_pct: null
max_rsrz_outlier_pct: null
min_em_backbone_inclusion: 0.7     # drop cryo-EM entries whose backbone is poorly in-density
require_validation_report: false

ligand_context_radius_A: 8.0
max_ligand_atoms: 25
